name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "Ziad-Yousfi"
          git config user.email "yousfiziadpro@gmail.com"

      - name: Fetch and merge upstream changes
        run: |
          git remote add upstream https://github.com/TheMostafaOsamaDev/Riwaq-Reader.git || true
          git fetch upstream main
          git checkout main
          git merge upstream/main -m "chore(sync): merge upstream changes from TheMostafaOsamaDev/Riwaq-Reader" || {
            echo "Conflict detected during automated merge. Please resolve manually."
            exit 1
          }
          git push origin main
